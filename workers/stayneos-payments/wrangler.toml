# stayneos-payments — Stripe webhook + payment intent worker
name = "stayneos-payments-staging"
workers_dev = false
preview_urls = false
compatibility_date = "2026-02-06"
compatibility_flags = ["nodejs_compat"]
main = "src/index.ts"

# Local validation only. Supply a reviewed, isolated config before commissioning.
[[d1_databases]]
binding = "DB"
database_name = "stayneos-local"
database_id = "00000000-0000-0000-0000-000000000000"

# ── Secrets (set via `wrangler secret put <name>`) ──
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# NEXTAUTH_SECRET   (for JWT verification in auth checks)
