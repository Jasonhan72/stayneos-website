name: Validate Standalone Workers (deployment suspended)
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck:workers
      - run: npm run test:workers
      - run: echo "Standalone deployment is suspended until isolated bindings and payment lifecycle acceptance are configured."
