name: Monitoring and Alerts

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  api-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node scripts/monitor/api-health-check.mjs
        env:
          HEALTHCHECK_URL: https://neos.rentals/api/health
          HEALTHCHECK_MAX_MS: '1800'

  security-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node scripts/monitor/security-events-check.mjs

  capacity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node scripts/monitor/capacity-check.mjs
