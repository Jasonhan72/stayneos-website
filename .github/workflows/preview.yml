name: Preview Deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # ── Gate 1: Typecheck (required) ──
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck

  # ── Gate 1b: Tests (required) ──
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Unit Tests
        run: npm run test -- --runInBand

  # ── Gate 2: Build + Deploy Preview ──
  build-and-deploy:
    name: Build + Deploy Preview
    needs: [typecheck, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps

      - name: Clean previous build cache
        run: rm -rf .next .open-next

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Build OpenNext for Cloudflare
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Deploy to preview worker
        id: deploy
        run: |
          npx wrangler deploy --name stayneos-preview 2>&1 | tee deploy-output.txt
          DEPLOY_URL=$(grep -o 'https://stayneos-preview[^ ]*\.workers\.dev' deploy-output.txt | head -1)
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL="https://stayneos-preview.neos-lab.workers.dev"
          fi
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Wait for deployment propagation
        run: sleep 30

      - name: Verify preview is live
        run: |
          PREVIEW_URL="${{ steps.deploy.outputs.url }}"
          echo "Checking $PREVIEW_URL ..."
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PREVIEW_URL")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ] || [ "$STATUS" = "308" ]; then
              echo "✅ Preview is live at $PREVIEW_URL"
              exit 0
            fi
            sleep 10
          done
          echo "⚠️ Preview may still be deploying. URL: $PREVIEW_URL"

  # ── Gate 3: E2E Tests (runs against preview URL) ──
  e2e:
    name: E2E Tests
    needs: [build-and-deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.build-and-deploy.outputs.url }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: npx playwright test

      - name: Upload E2E trace artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Gate 4: PR Comment ──
  comment:
    name: Comment PR
    needs: [typecheck, tests, build-and-deploy, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Post preview URL to PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-deployment
          message: |
            ## 🔍 Preview Deployment

            | Item | Status |
            |------|--------|
            | Typecheck | ${{ needs.typecheck.result == 'success' && '✅' || '❌' }} |
            | Tests | ${{ needs.tests.result == 'success' && '✅' || needs.tests.result == 'skipped' && '⏭️' || '❌' }} |
            | Build + Deploy | ${{ needs.build-and-deploy.result == 'success' && '✅' || '❌' }} |
            | E2E Tests | ${{ needs.e2e.result == 'success' && '✅' || needs.e2e.result == 'skipped' && '⏭️' || '❌' }} |
            | **Preview URL** | ${{ needs.build-and-deploy.result == 'success' && format('**[🔗 {0}]({0})**', needs.build-and-deploy.outputs.url) || 'N/A (deploy failed)' }} |
            | Commit | `${{ github.event.pull_request.head.sha }}` |

            > ℹ️ Preview worker: `stayneos-preview` — updated on every push to this PR.
