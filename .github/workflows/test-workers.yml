name: Test Workers

on:
  pull_request:
    paths:
      - 'workers/stayneos-payments/**'
      - 'workers/stayneos-booking/**'

jobs:
  typecheck-payments:
    name: Typecheck Payments
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/stayneos-payments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Check wrangler config
        run: npx wrangler deploy --dry-run --outdir dist

  typecheck-booking:
    name: Typecheck Booking
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/stayneos-booking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Check wrangler config
        run: npx wrangler deploy --dry-run --outdir dist
