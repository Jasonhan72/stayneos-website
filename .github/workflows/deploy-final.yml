name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "24"

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Build & Deploy
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --runInBand

      - name: Release checks
        run: |
          npm run lint
          npm run typecheck:workers
          npm run test:workers
          npm run test:config
          npm run check:i18n
          npm audit --omit=dev --audit-level=moderate

      - name: Clean previous build cache
        run: rm -rf .next .open-next

      - name: Build for Cloudflare
        run: npm run build:worker
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Deploy to Cloudflare
        run: npx --yes wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Purge Cloudflare CDN cache
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/906fba25052c42f9db98c8e045c97776/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  verify:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    name: Verify
    steps:
      - name: Wait for propagation
        run: sleep 45

      - name: Check primary site
        run: |
          set -euo pipefail
          for path in / /login /properties /api/health /property/1; do
            STATUS=$(curl --retry 3 --max-time 30 -L -sS -o /tmp/response -w "%{http_code}" "https://www.stayneos.com$path")
            test "$STATUS" = "200" || { echo "$path failed: $STATUS"; exit 1; }
            if [ "$path" = "/api/health" ]; then
              node -e 'if (JSON.parse(require("fs").readFileSync("/tmp/response")).ok !== true) process.exit(1)'
            else
              test -s /tmp/response
            fi
          done
