name: Deploy to Cloudflare Pages (Final)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  # 强制使用 Node.js 24 以避免弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Next.js App
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build application
        run: npm run build
        env:
          # 构建时环境变量
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            .next
            public
            package.json
            next.config.js
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    name: Deploy to Cloudflare Pages
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=stayneos
          # 使用 Next.js 运行时
          # Cloudflare Pages 会自动检测 Next.js 应用

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    name: Verify Deployment
    steps:
      - name: Wait for deployment propagation
        run: sleep 45

      - name: Verify site is live
        run: |
          echo "Checking main site..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://neos.rentals")
          echo "neos.rentals → HTTP $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Main site is live"
            
            # 检查市场洞察页面
            echo "Checking Market Insights..."
            MARKET_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://neos.rentals/market-insights")
            echo "market-insights → HTTP $MARKET_STATUS"
            
            if [ "$MARKET_STATUS" = "200" ]; then
              echo "✅ Market Insights page is live"
              exit 0
            else
              echo "⚠️ Market Insights page may have issues"
              exit 0  # 不失败，只是警告
            fi
          else
            echo "❌ Site is not responding correctly"
            exit 1
          fi