name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint || true

  deploy:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Build for Cloudflare
        run: npx opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion || true

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for propagation
        run: sleep 30

      - name: Check website
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://stayneos.com")
          echo "stayneos.com → HTTP $HTTP_STATUS"
          [ "$HTTP_STATUS" = "200" ] && echo "✅ Site is live" || echo "⚠️ Check deployment"
