name = "stayneos"
compatibility_date = "2026-02-06"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

# Pages configuration
[pages]
name = "stayneos"
pages_build_output_dir = "dist"
production_branch = "main"

# Static assets served from .open-next/assets
[assets]
directory = ".open-next/assets"

# Environment Variables
[vars]
RESEND_FROM_EMAIL = "hello@neos.rentals"
NODE_ENV = "production"
AI_CONCIERGE_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
ARIA_CHAT_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
NEXTAUTH_URL = "https://neos.rentals"
# SECURITY: NEXTAUTH_SECRET must be injected via `wrangler secret put NEXTAUTH_SECRET` — never set here
OPENCLAW_GATEWAY_URL = "http://localhost:18789"  # Development URL for Aria chat (backward compatibility)
# SECURITY: NEXTAUTH_SECRET 已轮换，必须通过 `wrangler secret put NEXTAUTH_SECRET` 注入
# Google OAuth credentials are stored as secrets - use wrangler secret put

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "stayneos-db"
database_id = "f667afae-6f66-4e4a-960a-37096eabdf03"

# R2 Image Storage
[[r2_buckets]]
bucket_name = "stayneos-images"
binding = "IMAGES"

# Workers AI Binding (free tier)
[ai]
binding = "AI"
