name = "stayneos"
compatibility_date = "2026-02-06"
compatibility_flags = ["nodejs_compat"]
main = "src/worker.ts"

# Static assets served from .open-next/assets
[assets]
directory = ".open-next/assets"

# Environment Variables
[vars]
RESEND_FROM_EMAIL = "reservations@send.neos.rentals"
NODE_ENV = "production"
AI_CONCIERGE_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
ARIA_CHAT_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
NEXTAUTH_URL = "https://www.stayneos.com"
# SECURITY: NEXTAUTH_SECRET must be injected via `wrangler secret put NEXTAUTH_SECRET` — never set here
# SECURITY: RESEND_API_KEY must be injected via GitHub Secret / `wrangler secret put RESEND_API_KEY` — never set here
# HOST_NOTIFICATION_EMAIL is optional; inject via secret/vars to override default host@neos.rentals
# SECURITY: Google OAuth credentials must be injected via `wrangler secret put`

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "stayneos-db"
database_id = "f667afae-6f66-4e4a-960a-37096eabdf03"

# R2 Image Storage
[[r2_buckets]]
bucket_name = "stayneos-images"
binding = "IMAGES"

# Workers AI Binding (free tier)
[ai]
binding = "AI"

# Durable Objects for messaging
[[durable_objects.bindings]]
name = "CONVERSATIONS"
class_name = "ConversationDO"

[[migrations]]
tag = "v1"
new_classes = ["ConversationDO"]


[triggers]
crons = ["0 3 * * *"]
