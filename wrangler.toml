name = "stayneos"
compatibility_date = "2026-02-06"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

# Static assets served from .open-next/assets
[assets]
directory = ".open-next/assets"

# Environment Variables
[vars]
RESEND_FROM_EMAIL = "hello@stayneos.com"
NODE_ENV = "production"
NEXTAUTH_URL = "https://stayneos.com"
NEXTAUTH_SECRET = ""
# SECURITY: NEXTAUTH_SECRET 已轮换，必须通过 `wrangler secret put NEXTAUTH_SECRET` 注入
# Google OAuth credentials are stored as secrets - use wrangler secret put

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "stayneos-db"
database_id = "f667afae-6f66-4e4a-960a-37096eabdf03"

# R2 Image Storage
[[r2_buckets]]
bucket_name = "stayneos-images"
binding = "IMAGES"

# Workers AI Binding (free tier)
[ai]
binding = "AI"
